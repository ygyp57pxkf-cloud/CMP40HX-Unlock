# 40HX diagnostic loader profile. Read README before deployment.
# RefindPlus v0.14.2.AE DEBUG build; only this system ESP is targeted.
timeout 8
textonly
scanfor manual
log_level 1
use_nvram false
disable_apfs_load
disable_rescan_dxe
badram_tag_mode 0
showtools reboot,shutdown
default_selection "40HX Shell diagnostic"

menuentry "40HX Shell diagnostic" {
    volume "@ESP_GUID@"
    loader \EFI\40HX-Auto\shellx64.efi
    options "-startup -nointerrupt -noconsolein -exit -delay 0"
}

menuentry "Windows recovery" {
    volume "@ESP_GUID@"
    loader \EFI\Microsoft\Boot\bootmgfw.efi
}